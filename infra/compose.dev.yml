# Local development database: MariaDB 11.8, the version Hostinger's shared hosting runs (decision D10).
# Port 3307, so another project's MySQL on 3306 can run at the same time.
#   pnpm db:up / pnpm db:down
# The init script also creates calls_test, the database `pnpm test:int` drops and rebuilds.
name: reaplift-calls

services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_USER: calls
      MARIADB_PASSWORD: calls
      MARIADB_DATABASE: calls
      MARIADB_ROOT_PASSWORD: calls-root
    ports:
      - '3307:3306'
    volumes:
      - mariadbdata:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      retries: 30

  # Local stand-in for Cloudflare R2 (call recordings, M6): SeaweedFS speaks the same S3 protocol.
  # (MinIO stopped publishing community images in 2025.) No S3 identities are set, so it accepts any key locally.
  #   docker compose -f infra/compose.dev.yml up -d s3
  s3:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -s3.port=8333 -dir=/data -volume.max=0
    ports:
      - '9010:8333'
    volumes:
      - s3data:/data

volumes:
  mariadbdata:
  s3data:
