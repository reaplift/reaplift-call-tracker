# Local development database. Port 5433 so reaplift-bsp's PostgreSQL (5432) can run at the same time.
#   pnpm db:up / pnpm db:down
name: reaplift-calls

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: calls
      POSTGRES_PASSWORD: calls
      POSTGRES_DB: calls
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U calls']
      interval: 2s
      retries: 30

volumes:
  pgdata:
