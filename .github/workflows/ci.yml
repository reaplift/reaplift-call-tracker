name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server_and_panel:
    name: server and panel
    runs-on: ubuntu-latest
    services:
      mariadb:
        # Hostinger's version (D10).
        image: mariadb:11.8
        env:
          MARIADB_USER: calls
          MARIADB_PASSWORD: calls
          MARIADB_DATABASE: calls
          MARIADB_ROOT_PASSWORD: calls-root
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: mysql://calls:calls@127.0.0.1:3307/calls
      # test:int drops every table in this database; CI's database is thrown away after the run.
      TEST_DATABASE_URL: mysql://calls:calls@127.0.0.1:3307/calls
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build

  android:
    name: android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug test lint --console=plain
